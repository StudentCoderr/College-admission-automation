<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 480" role="img" aria-label="Education themed line pattern">
  <g fill="none" stroke="#dbeafe" stroke-opacity="0.17" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
    <!-- graduation cap -->
    <path d="M58 126 112 100l54 26-54 26z"/>
    <path d="M84 139v28c0 15 56 15 56 0v-28"/>
    <path d="M166 126v39"/>

    <!-- open book -->
    <path d="M282 138c18-11 36-11 54 0v49c-18-11-36-11-54 0z"/>
    <path d="M336 138c18-11 36-11 54 0v49c-18-11-36-11-54 0z"/>
    <path d="M336 138v49"/>

    <!-- pencil -->
    <g transform="rotate(-36 123 347)">
      <rect x="108" y="296" width="30" height="92" rx="6"/>
      <path d="M108 296l15-23 15 23"/>
      <path d="M108 388l15 23 15-23"/>
      <path d="M123 411v17"/>
    </g>

    <!-- globe -->
    <circle cx="353" cy="342" r="49"/>
    <path d="M304 342h98"/>
    <path d="M353 293c-22 29-22 69 0 98"/>
    <path d="M353 293c22 29 22 69 0 98"/>

