    <path d="M192 342c31 3 64 5 98 5" stroke-dasharray="3 8"/>
    <path d="M404 222c12 32 12 65 0 98" stroke-dasharray="3 8"/>

    <!-- small accents -->
    <path d="M218 258h28M232 244v28"/>
    <path d="M54 238c14 0 28 3 41 9"/>
    <circle cx="226" cy="408" r="7"/>
    <circle cx="64" cy="64" r="4"/>
