{% extends "auth/_auth_layout.html" %}
{% block title %}Login — {{ app_name }}{% endblock %}
{% block auth_content %}
  <div class="auth-logo" aria-hidden="true">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></svg>
  </div>
  <h1>Sign in to your account</h1>
  <p class="lead">Students and administrators can log in here.</p>

  <form method="post" action="{{ url_for('auth.login') }}" novalidate>
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <input type="hidden" name="next" value="{{ request.args.get('next', '') }}">

    <div class="field">
      <label for="email">Email address</label>
      <input type="email" id="email" name="email" value="{{ email or '' }}"
             required autocomplete="email" placeholder="you@example.com" autofocus>
    </div>

    <div class="field">
      <label for="password">Password</label>
      <div class="password-wrap">
        <input type="password" id="password" name="password" required
               autocomplete="current-password" placeholder="Enter your password">
        <button type="button" class="pw-toggle" data-pw-toggle="password"
                aria-label="Show or hide password" aria-pressed="false">
          <svg class="eye-on" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>
          <svg class="eye-off" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path><path d="M1 1l22 22"></path></svg>
        </button>
      </div>
    </div>

    <button class="btn btn-block" type="submit" data-loading="Logging in…">Login</button>
  </form>

  <p class="auth-alt">
    New student? <a href="{{ url_for('auth.register') }}">Create an account</a>
  </p>
  <p class="auth-alt small-note">
    <a href="{{ url_for('admin.admin_login') }}">Administrator sign in</a>
  </p>
{% endblock %}
