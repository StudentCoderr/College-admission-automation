  <g fill="#dbeafe" fill-opacity="0.16">
    <circle cx="26" cy="26" r="2"/>
    <circle cx="454" cy="26" r="2"/>
    <circle cx="26" cy="454" r="2"/>
    <circle cx="454" cy="454" r="2"/>
    <circle cx="250" cy="212" r="2.5"/>
    <circle cx="452" cy="205" r="2"/>
    <circle cx="196" cy="455" r="2"/>
